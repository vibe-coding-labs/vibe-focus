name: Verify (macOS)

# 特征分支的真实门禁通道（2026-11-03）。
#
# 背景：开发会话跑在 Linux 主机，无 Swift 工具链且工程依赖 AppKit，
# AGENTS.md 规定的三道门禁无法本机执行。此工作流把门禁搬到 macOS runner：
#   swift build（零警告）→ bash Tests/run_all_tests.sh → swift run VibeFocusTestRunner
#
# 只由本特征分支的 push 触发（不挂 main / 不挂 PR），合并进 main 后可用
# workflow_dispatch 手动跑；不会给日常提交带来额外消耗。

on:
  push:
    branches:
      - fix/restore-space-observability
  workflow_dispatch:
    inputs:
      domains:
        description: '只跑指定 Runner 域（逗号分隔的 runXxxTests；留空=全量）'
        required: false
        default: ''
      watchdog_minutes:
        description: 'Runner 看门狗分钟数（默认 25）'
        required: false
        default: '25'

jobs:
  gates:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            .build
            .build-coverage
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      # Csqlite3/module.modulemap 硬编码了开发机的 CLT SDK 路径
      # （MacOSX26.2.sdk/usr/include/sqlite3.h）；GitHub runner 的 CLT SDK 不含
      # usr/include 头文件，构建时报 header not found。CI 侧把 Xcode SDK 的同名头
      # 软链到该路径（不改仓库构建配置，避免影响并行会话）。
      - name: Prepare SQLite header for hardcoded CLT path
        run: |
          target="/Library/Developer/CommandLineTools/SDKs/MacOSX26.2.sdk/usr/include/sqlite3.h"
          if [ ! -f "$target" ]; then
            sdk="$(xcrun --sdk macosx --show-sdk-path)"
            test -f "$sdk/usr/include/sqlite3.h"
            sudo mkdir -p "$(dirname "$target")"
            sudo ln -sf "$sdk/usr/include/sqlite3.h" "$target"
          fi
          ls -l "$target"

      - name: swift build (zero warnings)
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log
          if grep -n "warning:" build.log; then
            echo "::error::swift build 出现警告（门禁要求零警告）"
            exit 1
          fi

      - name: Standalone tests
        run: bash Tests/run_all_tests.sh

      - name: Runner tests
        env:
          NSUnbufferedIO: "YES"
          VIBEFOCUS_RUNNER_DOMAINS: ${{ inputs.domains }}
          WATCHDOG_MINUTES: ${{ inputs.watchdog_minutes || '25' }}
        run: |
          # CI 机器没有 yabai/AX 授权，个别真机依赖用例可能进入长等待；看门狗兜底
          # 并保留截止前的无缓冲输出（最后一段 === 域名 === 即卡住位置）。
          # 定向回归：workflow_dispatch 传 domains=<逗号分隔域方法名>。
          swift build --product VibeFocusTestRunner
          .build/debug/VibeFocusTestRunner &
          pid=$!
          ( sleep $((10#$WATCHDOG_MINUTES * 60)); kill -9 "$pid" 2>/dev/null ) &
          watchdog=$!
          wait "$pid"; status=$?
          kill "$watchdog" 2>/dev/null || true
          exit $status

      # 行/region 真实覆盖率（Runner 通道，@testable 直测 Sources）。报告逐文件
      # 输出，作为「补哪一块」的选靶依据；同时上传 artifact 便于离线分析。
      - name: Coverage (Runner, llvm-cov)
        if: success()
        env:
          NSUnbufferedIO: "YES"
          VIBEFOCUS_RUNNER_DOMAINS: ${{ inputs.domains }}
        run: |
          set -o pipefail
          bash scripts/coverage_test_runner.sh 2>&1 | tee coverage-report.txt

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report.txt
          if-no-files-found: warn
