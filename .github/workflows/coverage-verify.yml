name: Coverage (macOS)

# 覆盖率线专用 macOS 通道（2026-11-03）。
#
# 开发会话在 Linux 主机（无 Swift 工具链、工程依赖 AppKit），AGENTS.md 门禁只能在
# macOS 跑。本工作流只服务 test/coverage-sprint 分支：
#   构建零警告 → Standalone → llvm-cov 全量 Runner 覆盖率报告（artifact）。
# 覆盖率脚本容忍 Runner 断言失败（profraw 已落盘即出报告），因此 CI 无 yabai/AX
# 导致的真机域红不会挡住覆盖率数字；报告仍会标注 Runner 退出码。
#
# 定向采集：workflow_dispatch 传 domains=<逗号分隔 runXxxTests>，只跑相关域。

on:
  push:
    branches:
      - test/coverage-sprint
  workflow_dispatch:
    inputs:
      domains:
        description: '只跑指定 Runner 域（逗号分隔；留空=全量）'
        required: false
        default: ''

# 连续 push 只保留最新一轮全量采集：旧轮（可能正卡在环境性慢域）就地取消，
# 避免队列堆积把 macOS 分钟数耗在过期提交上。
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: macos-latest
    # 全量 Runner 在无 yabai/AX 的 runner 上约 60-80 分钟（实测：25 分钟内只跑到
    # 第 55/285 个域，且被环境性挂起拖住）。看门狗与作业上限同步放宽。
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            .build
            .build-coverage
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      # Csqlite3/module.modulemap 硬编码开发机 CLT SDK 路径；runner 的 CLT SDK 不含
      # usr/include 头文件。CI 侧软链 Xcode SDK 同名头（不改仓库构建配置）。
      - name: Prepare SQLite header for hardcoded CLT path
        run: |
          target="/Library/Developer/CommandLineTools/SDKs/MacOSX26.2.sdk/usr/include/sqlite3.h"
          if [ ! -f "$target" ]; then
            sdk="$(xcrun --sdk macosx --show-sdk-path)"
            test -f "$sdk/usr/include/sqlite3.h"
            sudo mkdir -p "$(dirname "$target")"
            sudo ln -sf "$sdk/usr/include/sqlite3.h" "$target"
          fi
          ls -l "$target"

      - name: swift build (zero warnings)
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log
          if grep -n "warning:" build.log; then
            echo "::error::swift build 出现警告（门禁要求零警告）"
            exit 1
          fi

      - name: Standalone tests
        run: bash Tests/run_all_tests.sh

      - name: Coverage (Runner, llvm-cov)
        if: always()
        env:
          NSUnbufferedIO: "YES"
          # workflow_dispatch 定向采集：逗号分隔域名单；空=全部。
          VIBEFOCUS_RUNNER_DOMAINS: ${{ inputs.domains }}
          # 逐域隔离后不再整域跳过：此前的挂起（activeSessionList 12min、
          # SettingsCommon 21min）多为前序域遗留定时器/全局态所致，独立进程可隔离；
          # 单域仍挂起则由 VIBEFOCUS_PER_DOMAIN_TIMEOUT 兜底，只损失该域。
          # 环境性断言红（无 yabai/AX）不阻断覆盖率——退出码非 0 仍会落 profraw。
          VIBEFOCUS_RUNNER_SKIP_DOMAINS: ""
          # 逐域独立进程：CI 上个别域会唤醒单例后台定时器永久空转，单进程全量跑
          # 会被一个挂起域拖死并丢掉整轮 profraw。逐域化后单域挂起只损失该域。
          VIBEFOCUS_PER_DOMAIN_RUN: "1"
          # UI 域带「最近 2 分钟无用户输入」观测窗，个别面板域可能接近 120s；
          # 放宽到 180s 让它们正常收尾，全局 80 分钟预算仍是硬上限。
          VIBEFOCUS_PER_DOMAIN_TIMEOUT: "180"
          # 合法但慢的单域（真实 curl 打环，CI 上单请求可被拖到 30s 级）单独放宽，
          # 避免误杀整域 profraw（实测 120s 只跑到 CLI 矩阵中段）。
          VIBEFOCUS_PER_DOMAIN_TIMEOUT_OVERRIDES: "runAgentAccessLoopbackTests=300"
          # 弹窗门由脚本按域精确放开：runDomainUIGated 注册的 8 个 UI 域在临时
          # runner 上带 VIBEFOCUS_UI_E2E=1 执行；其余域保持 0（真机零弹窗铁律不变）。
          WATCHDOG_MINUTES: "80"
        run: |
          set -o pipefail
          bash scripts/coverage_test_runner.sh 2>&1 | tee coverage-report.txt

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage-report.txt
            coverage.lcov
          if-no-files-found: warn
