h1{color:#e8eef7;text-align:center;font-size:25px;font-weight:700;padding-top:20px;letter-spacing:1px}
.scr{position:absolute;border:1.5px solid #233450;border-radius:10px;background:#0e1729}
.scr .mb{position:absolute;top:0;left:0;right:0;height:16px;border-radius:8px 8px 0 0;background:rgba(122,144,176,0.12);border-bottom:1px solid #1a2c44}

.tabs{position:absolute;top:24px;left:12px;right:12px;display:flex;gap:4px}
.tabs i{flex:1;font-style:normal;font-size:11px;font-weight:600;text-align:center;color:#51647f;background:#132039;border:1px solid #233450;border-radius:5px;padding:2px 0}
.tabs i.on{color:#6fc3e8;border-color:#2f6d8f;background:#0d2233}

.gd .t{background:#221c15;border:1px solid #3a2e24}

.gd .c{background:#f3efe4;border:1px solid #3a3228}

.gd .c::after{content:'';position:absolute;top:11px;left:6px;right:6px;bottom:6px;background:repeating-linear-gradient(0deg,rgba(107,138,179,.35) 0 2px,transparent 2px 6px)}
.gdm{bottom:3px}
.slot{position:absolute;border:1.5px dashed #2f9fce;border-radius:4px;background:rgba(47,159,206,.06);opacity:0;animation:s 7.5s linear infinite;z-index:2}
